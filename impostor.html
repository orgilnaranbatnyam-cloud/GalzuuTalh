<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Impostor</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1B2D;
    --red: #E63946;
    --white: #F1FAEE;
    --blue: #457B9D;
    --panel: #172a44;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--white);
    font-family: 'Rubik', 'Arial Black', Arial, sans-serif; font-weight: 800; }
  #app { min-height: 100%; max-width: 480px; margin: 0 auto; padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; }
  h1 { font-size: 44px; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
  h1 span { color: var(--red); }
  h2 { font-size: 28px; margin: 0; text-transform: uppercase; }
  p { margin: 0; font-size: 18px; color: var(--blue); }
  .panel { background: var(--panel); border: 3px solid var(--blue); border-radius: 20px; padding: 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .label { font-size: 18px; text-transform: uppercase; text-align: left; flex: 1; min-width: 0; }
  .num { font-size: 36px; min-width: 50px; flex-shrink: 0; }
  button { font-family: inherit; font-weight: 900; font-size: 22px; text-transform: uppercase;
    border: none; border-radius: 18px; padding: 18px; cursor: pointer; color: var(--white);
    background: var(--red); box-shadow: 0 6px 0 #9c1f2a; transition: transform .08s; }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #9c1f2a; }
  button:disabled { opacity: .5; pointer-events: none; }
  button.alt { background: var(--blue); box-shadow: 0 6px 0 #2f566e; }
  button.alt:active { box-shadow: 0 2px 0 #2f566e; }
  button.round { width: 56px; height: 56px; flex: 0 0 56px; padding: 0; font-size: 30px; border-radius: 50%; }
  select { font-family: inherit; font-weight: 800; font-size: 18px; padding: 12px; border-radius: 14px;
    border: 3px solid var(--blue); background: var(--bg); color: var(--white); width: 100%; }
  .toggle { display: flex; gap: 8px; }
  .toggle button { flex: 1; padding: 12px; font-size: 18px; background: var(--bg); box-shadow: none;
    border: 3px solid var(--blue); }
  .toggle button.on { background: var(--red); border-color: var(--red); }
  .card { background: var(--white); color: var(--bg); border-radius: 24px; padding: 40px 16px;
    font-size: 40px; word-break: break-word; }
  .card.imp { background: var(--red); color: var(--white); }
  .card.mystery { background: var(--panel); color: var(--white); border: 3px dashed var(--blue);
    font-size: 96px; padding: 30px 16px; }
  .card small { display: block; font-size: 18px; margin-top: 10px; opacity: .85; }
  .timer { font-size: 80px; letter-spacing: 2px; }
  .big { font-size: 56px; }
  .red { color: var(--red); }
  .warn { color: var(--red); font-size: 18px; }
  .back { color: var(--blue); font-size: 18px; text-decoration: none; text-align: left; text-transform: uppercase; }
 
  /* sound on/off button (top right) */
  .mute { position: fixed; top: 12px; right: 12px; z-index: 10; width: 44px; height: 44px; padding: 0;
    font-size: 20px; border-radius: 50%; background: var(--panel); border: 3px solid var(--blue); box-shadow: none; }
  .mute:active { transform: scale(.92); box-shadow: none; }
  .mute.m2 { right: 64px; }
  .mute.off { opacity: .5; border-color: var(--red); }
 
  /* reveal animations */
  @keyframes shake { 0%,100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-8px) rotate(-1.5deg); }
    75% { transform: translateX(8px) rotate(1.5deg); } }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); } }
  .shake { animation: shake .22s infinite; }
  .pop { animation: pop .45s ease-out; }
  @media (prefers-reduced-motion: reduce) { .shake, .pop { animation: none; } }
</style>
</head>
<body>
<button class="mute" id="snd" data-sfx="none" onclick="toggleSound()" aria-label="Sound">🔊</button>
<button class="mute m2" id="mus" data-sfx="none" onclick="toggleMusic()" aria-label="Music">🎵</button>
<div id="app"></div>
 
<script>
/* =====================================================
   EDIT HERE: all visible text (STR) and word lists (WORDS)
   NEW strings are at the bottom of STR (whoIsImpostor, showImpostor).
   They are English placeholders - write your own Mongolian.
   ===================================================== */
const STR = {
  title1: "Им",
  title2: "постер",
  subtitle: "Урвагчийг олцгооё!",
  players: "Тоглогчдын тоо",
  impostors: "Урвагчдын тоо",
  category: "Сэжүүр",
  hint: "Урвагч сэжүүрийг харах",
  yes: "Тийм",
  no: "Үгүй",
  start: "Эхлэх",
  player: "Тоглогч",
  passTo: "Үгээ хараад цааш дамжуулна уу",
  tapToSee: "Үг харах",
  yourWord: "Таны үг",
  youAreImpostor: "ТА БОЛ УРВАГЧ!",
  hideNext: "Нуух, дараагийнх",
  hideStart: "Нуух, эхлүүлэх",
  discuss: "Хэлэлцэх",
  startsFirst: "хэлнэ",
  timerStart: "Цаг эхлүүлэх",
  timerPause: "Түр зогсоох",
  timeUp: "Хугацаа дууслаа!",
  vote: "Дуусгах",
  theWordWas: "Нууц үг:",
  impostorWas: "Урвагч нь:",
  impostorsWere: "Урвагчид нь:",
  again: "Дахин тоглох",
  home: "Нүүр хуудас",
  random: "Санамсаргүй",
  back: "← Бүх тоглоом",
  whoIsImpostor: "Хэн урвагч вэ?",
  showImpostor: "Урвагчийн харуулах",
  tooFew: "Хэт цөөн тоглогч!",
  tooFewImp: "Хэт цөөн урвагч!",
  tooManyImp: "Хэт олон урвагч!"
};
 
const WORDS = {
  "Амьтад": [
    "Нохой", "Муур", "Морь", "Тэмээ", "Чоно", "Бүргэд",
    "Хонь", "Загас", "Үхэр", "Ямаа", "Шонхор", "Заан",
    "Үнэг", "Шилүүс", "Ирвэс", "Мазаалай"
  ],
 
  "Хоол хүнс": [
    "Пицца", "Шөл", "Бууз", "Талх", "Алим", "Сүү",
    "Чихэр", "Будаа", "Бантан", "Цуйван",
    "Ногоотой шөл", "Хуушуур", "Хорхог",
    "Битүү шөл", "Будаатай хуурга", "Ороомог",
    "Пирошки", "Банштай цай"
  ],
 
  "Жимс, жимсгэнэ": [
    "Чацаргана", "Мойл", "Гүзээлзгэнэ"
  ],
 
  "Газар": [
    "Сургууль", "Цэцэрлэгт хүрээлэн", "Эмнэлэг",
    "Зах", "Нисэх буудал", "Номын сан",
    "Кино театр", "Амьтны хүрээлэн"
  ],
 
  "Эд зүйлс": [
    "Утас", "Бөмбөг", "Унадаг дугуй", "Ном",
    "Шүхэр", "Цаг", "Толь", "Түлхүүр"
  ],
 
  "Мэргэжил": [
    "Багш", "Эмч", "Жолооч", "Дуучин",
    "Тогооч", "Цагдаа", "Малчин", "Нисгэгч"
  ]
};
/* ===================================================== */
 
/* =====================================================
   MUSIC SETTINGS - edit here to change the background music.
   Option A (default): the built-in tune below, made from notes.
     bpm = speed. bass / lead = one number per step, 16 steps then it loops.
     Each number is a note's pitch in Hz, 0 = silence.
     Handy notes: A2 110, C3 130.81, D3 146.83, E3 164.81, G3 196,
                  A3 220, C4 261.63, D4 293.66, E4 329.63, G4 392, A4 440
   Option B: use your own music file. Put it in the SAME folder as
     this page and write its name in MUSIC_FILE, e.g. "music.mp3".
     Leave MUSIC_FILE as "" to use the built-in tune.
   ===================================================== */
const MUSIC_FILE = "";
const MUSIC_VOLUME = 0.3;   /* only for your own file: 0 (silent) to 1 (loud) */
const MUSIC = {
  bpm: 110,
  bass: [110, 0, 110, 0, 130.81, 0, 123.47, 0, 110, 0, 110, 0, 146.83, 0, 130.81, 0],
  lead: [440, 0, 0, 523.25, 0, 0, 659.25, 0, 587.33, 0, 0, 523.25, 0, 493.88, 0, 0]
};
/* ===================================================== */
 
/* =====================================================
   SOUND EFFECTS - made with the browser's built-in audio,
   so there are no sound files to upload.
   NOTE: the card sound is the SAME for the impostor and
   for everyone else, so nobody can hear who the impostor is.
   ===================================================== */
let audioCtx = null;
let soundOn = true;
try { soundOn = localStorage.getItem('imp_sound') !== 'off'; } catch (e) {}
 
function ctx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
 
function tone(freq, start, dur, type, vol, slideTo) {
  if (soundOn) playNote(freq, start, dur, type, vol, slideTo);
}
 
function playNote(freq, start, dur, type, vol, slideTo) {
  const c = ctx();
  if (!c) return;
  const t0 = c.currentTime + start;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
 
const SFX = {
  click:    () => tone(520, 0, 0.06, 'square', 0.07),
  up:       () => tone(660, 0, 0.07, 'square', 0.07),
  down:     () => tone(420, 0, 0.07, 'square', 0.07),
  start:    () => { tone(392, 0, 0.1, 'square', 0.08); tone(523, 0.1, 0.1, 'square', 0.08); tone(784, 0.2, 0.2, 'square', 0.08); },
  flip:     () => tone(300, 0, 0.18, 'sawtooth', 0.07, 900),
  tick:     () => tone(1000, 0, 0.04, 'square', 0.05),
  error:    () => { tone(220, 0, 0.12, 'sawtooth', 0.12); tone(150, 0.12, 0.25, 'sawtooth', 0.12); },
  buzzer:   () => { tone(150, 0, 0.5, 'sawtooth', 0.15); tone(120, 0.3, 0.6, 'sawtooth', 0.15); },
  drumroll: () => { for (let i = 0; i < 14; i++) tone(110 + i * 5, i * 0.1, 0.08, 'triangle', 0.09 + i * 0.008); },
  reveal:   () => { tone(110, 0, 0.9, 'sawtooth', 0.15, 55); tone(220, 0, 0.45, 'square', 0.08);
                    tone(330, 0.05, 0.5, 'square', 0.07); tone(660, 0.2, 0.4, 'triangle', 0.1); }
};
 
/* every button plays a click, unless it has its own data-sfx ("none" = silent) */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const name = b.dataset.sfx || 'click';
  if (name !== 'none' && SFX[name]) SFX[name]();
}, true);
 
function updateSoundBtn() {
  document.getElementById('snd').textContent = soundOn ? '🔊' : '🔇';
}
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('imp_sound', soundOn ? 'on' : 'off'); } catch (e) {}
  updateSoundBtn();
  if (soundOn) SFX.click();
}
 
/* ---------- background music (separate on/off from the sound effects) ---------- */
let musicOn = true;
try { musicOn = localStorage.getItem('imp_music') !== 'off'; } catch (e) {}
let musicUnlocked = false;   /* browsers only allow audio after the first tap */
let musicTimer = null, musicStep = 0, musicNext = 0;
const bgm = MUSIC_FILE ? Object.assign(new Audio(MUSIC_FILE), { loop: true, volume: MUSIC_VOLUME }) : null;
 
function musicTick() {
  const c = ctx();
  if (!c) return;
  const stepDur = 60 / MUSIC.bpm / 2;
  while (musicNext < c.currentTime + 0.3) {
    const i = musicStep % MUSIC.bass.length;
    const at = Math.max(0, musicNext - c.currentTime);
    if (MUSIC.bass[i]) playNote(MUSIC.bass[i], at, stepDur * 0.9, 'triangle', 0.06);
    if (MUSIC.lead[i]) playNote(MUSIC.lead[i], at, stepDur * 0.8, 'square', 0.025);
    musicStep++;
    musicNext += stepDur;
  }
}
 
function startMusic() {
  if (!musicOn || !musicUnlocked) return;
  if (bgm) { bgm.play().catch(() => {}); return; }
  if (musicTimer) return;
  const c = ctx();
  if (!c) return;
  musicNext = c.currentTime + 0.1;
  musicTimer = setInterval(musicTick, 100);
}
 
function stopMusic() {
  if (bgm) { bgm.pause(); return; }
  clearInterval(musicTimer);
  musicTimer = null;
}
 
function updateMusicBtn() {
  document.getElementById('mus').classList.toggle('off', !musicOn);
}
 
function toggleMusic() {
  musicOn = !musicOn;
  try { localStorage.setItem('imp_music', musicOn ? 'on' : 'off'); } catch (e) {}
  updateMusicBtn();
  if (musicOn) { musicUnlocked = true; startMusic(); } else { stopMusic(); }
}
 
/* start the music on the first tap anywhere */
document.addEventListener('click', () => { musicUnlocked = true; startMusic(); }, { once: true, capture: true });
/* pause the music when the tab is hidden */
document.addEventListener('visibilitychange', () => { if (document.hidden) stopMusic(); else startMusic(); });
/* ===================================================== */
 
const app = document.getElementById('app');
const S = { players: 4, impostors: 1, category: "__random", hint: true,
  word: "", cat: "", imps: [], idx: 0, starter: 0, timeLeft: 180, timerId: null, revealing: false, warn: false };
 
const $ = (h) => { app.innerHTML = h; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const maxImp = () => Math.ceil(S.players / 2) - 1; /* impostors must be fewer than half of the players */
 
function home() {
  clearInterval(S.timerId); S.timerId = null;
  const warn = S.warn; S.warn = false;
  if (S.impostors > maxImp()) S.impostors = maxImp();
  const cats = Object.keys(WORDS);
  $(`
    <a class="back" href="index.html">${STR.back}</a>
    <h1>${STR.title1}<span>${STR.title2}</span></h1>
    <p>${STR.subtitle}</p>
    <div class="panel row">
      <div class="label">${STR.players}</div>
      <button class="round alt" data-sfx="down" onclick="chg('players',-1)">−</button>
      <div class="num">${S.players}</div>
      <button class="round alt" data-sfx="up" onclick="chg('players',1)">+</button>
    </div>
    ${warn === 'players' ? `<p class="warn">${STR.tooFew}</p>` : ''}
    <div class="panel row">
      <div class="label">${STR.impostors}</div>
      <button class="round alt" data-sfx="down" onclick="chg('impostors',-1)">−</button>
      <div class="num">${S.impostors}</div>
      <button class="round alt" data-sfx="up" onclick="chg('impostors',1)">+</button>
    </div>
    ${warn === 'impostors' ? `<p class="warn">${STR.tooFewImp}</p>` : ''}
    ${warn === 'impostorsMax' ? `<p class="warn">${STR.tooManyImp}</p>` : ''}
    <div class="panel">
      <div class="label" style="margin-bottom:10px">${STR.category}</div>
      <select onchange="S.category=this.value">
        <option value="__random" ${S.category==='__random'?'selected':''}>${STR.random}</option>
        ${cats.map(c => `<option value="${c}" ${S.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="panel">
      <div class="label" style="margin-bottom:10px">${STR.hint}</div>
      <div class="toggle">
        <button class="${S.hint?'on':''}" onclick="S.hint=true;home()">${STR.yes}</button>
        <button class="${!S.hint?'on':''}" onclick="S.hint=false;home()">${STR.no}</button>
      </div>
    </div>
    <button data-sfx="start" onclick="startGame()">${STR.start}</button>
  `);
}
 
function chg(k, d) {
  if (k === 'players' && d < 0 && S.players <= 3) {
    S.warn = 'players';
    SFX.error();
    if (navigator.vibrate) navigator.vibrate(150);
    home();
    return;
  }
  if (k === 'impostors' && d < 0 && S.impostors <= 1) {
    S.warn = 'impostors';
    SFX.error();
    if (navigator.vibrate) navigator.vibrate(150);
    home();
    return;
  }
  if (k === 'impostors' && d > 0 && S.impostors >= maxImp()) {
    S.warn = 'impostorsMax';
    SFX.error();
    if (navigator.vibrate) navigator.vibrate(150);
    home();
    return;
  }
  if (k === 'players') S.players = Math.min(35, Math.max(3, S.players + d));
  if (k === 'impostors') S.impostors = Math.min(maxImp(), Math.max(1, S.impostors + d));
  home();
}
 
function startGame() {
  S.cat = S.category === "__random" ? pick(Object.keys(WORDS)) : S.category;
  S.word = pick(WORDS[S.cat]);
  const ids = [...Array(S.players).keys()];
  S.imps = [];
  while (S.imps.length < S.impostors) {
    const i = pick(ids.filter(x => !S.imps.includes(x)));
    S.imps.push(i);
  }
  S.idx = 0;
  S.starter = Math.floor(Math.random() * S.players);
  S.timeLeft = 180;
  S.revealing = false;
  passScreen();
}
 
function passScreen() {
  $(`
    <p>${STR.passTo}</p>
    <div class="big">${STR.player} ${S.idx + 1}</div>
    <button data-sfx="flip" onclick="showCard()">${STR.tapToSee}</button>
  `);
}
 
function showCard() {
  const isImp = S.imps.includes(S.idx);
  const last = S.idx === S.players - 1;
  $(`
    <p>${STR.player} ${S.idx + 1}</p>
    ${isImp
      ? `<div class="card imp">${STR.youAreImpostor}${S.hint ? `<small>${STR.category}: ${S.cat}</small>` : ''}</div>`
      : `<div class="card"><small style="margin:0 0 10px">${STR.yourWord}</small>${S.word}<small>${STR.category}: ${S.cat}</small></div>`}
    <button class="alt" onclick="${last ? 'playScreen()' : 'S.idx++;passScreen()'}">${last ? STR.hideStart : STR.hideNext}</button>
  `);
}
 
const fmt = (t) => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
 
function playScreen() {
  $(`
    <h2>${STR.discuss}</h2>
    <p>${STR.player} ${S.starter + 1} ${STR.startsFirst}</p>
    <div class="timer" id="t">${fmt(S.timeLeft)}</div>
    <button class="alt" id="tb" onclick="toggleTimer()">${STR.timerStart}</button>
    <button onclick="reveal()">${STR.vote}</button>
  `);
}
 
function toggleTimer() {
  const btn = document.getElementById('tb');
  if (S.timerId) { clearInterval(S.timerId); S.timerId = null; btn.textContent = STR.timerStart; return; }
  btn.textContent = STR.timerPause;
  S.timerId = setInterval(() => {
    S.timeLeft--;
    const el = document.getElementById('t');
    if (el) el.textContent = fmt(S.timeLeft);
    if (S.timeLeft > 0 && S.timeLeft <= 10) SFX.tick();
    if (S.timeLeft <= 0) {
      clearInterval(S.timerId); S.timerId = null;
      if (el) el.textContent = STR.timeUp;
      SFX.buzzer();
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    }
  }, 1000);
}
 
/* Step 1 of the ending: a "?" card and a button. Nothing is revealed yet. */
function reveal() {
  clearInterval(S.timerId); S.timerId = null;
  S.revealing = false;
  $(`
    <h2>${STR.whoIsImpostor}</h2>
    <div class="card mystery" id="mys">?</div>
    <button id="shb" data-sfx="none" onclick="showImpostor()">${STR.showImpostor}</button>
  `);
}
 
/* Step 2: drumroll, then show the impostor(s) and the word. */
function showImpostor() {
  if (S.revealing) return;
  S.revealing = true;
  const mys = document.getElementById('mys');
  const shb = document.getElementById('shb');
  if (mys) { mys.classList.add('shake'); mys.textContent = '...'; }
  if (shb) shb.disabled = true;
  SFX.drumroll();
  setTimeout(() => {
    SFX.reveal();
    if (navigator.vibrate) navigator.vibrate([200, 100, 400]);
     const names = S.imps.map(i => `${STR.player} ${i + 1}`).join(' & ');
    /* big for 1-2 impostors, smaller when there are many so the names still fit */
    const impSize = S.imps.length <= 2 ? 56 : S.imps.length <= 4 ? 44 : 34;
    $(`
      <p>${S.imps.length > 1 ? STR.impostorsWere : STR.impostorWas}</p>
      <div class="card imp pop" style="font-size:${impSize}px;padding:44px 16px">${names}</div>
      <p>${STR.theWordWas}</p>
      <div class="card" style="font-size:26px;padding:16px">${S.word}</div>
      <button data-sfx="start" onclick="startGame()">${STR.again}</button>
      <button class="alt" onclick="home()">${STR.home}</button>
    `);
  }, 1500);
}
 
updateSoundBtn();
updateMusicBtn();
home();
</script>
</body>
</html>
